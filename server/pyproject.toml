[project]
name = "quiz-by-quiz-api"
version = "0.1.0"
description = "Network room API for quiz-by-quiz"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.116,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: requires an explicit disposable PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
