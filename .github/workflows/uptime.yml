# 공개 서비스 점검 (uptime monitor)
#
# 15분마다 공개 API의 release gate와 Pages를 **읽기만 해서** 본다(deploy/oracle/uptime.py check).
# 방이나 세션을 만들지 않는다. 실패하면 «운영 경보» 이슈 하나를 열거나(열린 것이 있으면 거기에
# 덧붙인다 — 열린 경보는 늘 하나다) job을 실패로 끝내 GitHub이 소유자에게 실패 메일을 보내게 한다.
# 통과하면 열린 경보에 회복을 남기고 닫는다. 소유자 결정: 경보는 이슈 + 실패 메일이다.
#
# - schedule은 기본 브랜치(main)의 이 파일로만 돈다. 저장소에 60일 동안 활동이 없으면 GitHub이
#   schedule을 멈춘다(Actions 탭에서 다시 켠다).
# - 계획된 배포(API가 503 migration-required를 내는 동안)에는 경보가 열린다. 그동안은
#   `gh workflow disable uptime.yml`로 끄고 끝나면 `gh workflow enable uptime.yml`로 켠다.
# - 취소된 실행(손으로 끊었거나 job 한도 10분에 걸린 것)은 경보를 열지도 닫지도 않는다 — 점검이
#   실패한 것이 아니다. 점검 step이 제 한도(8분)를 넘겨 멈추면 그 step만 실패하고 실패로 알린다.
# 읽는 법은 deploy/oracle/README.md «Uptime monitor».

name: Uptime monitor

on:
  schedule:
    # 15분 간격이되 정각(:00)을 피한다. GitHub 은 정각 부근에 예약이 몰려 늦추거나 건너뛴다고 안내하고, 실제로
    # '*/15' 로 둔 동안 main 에 들어온 뒤 7시간 넘게 한 번도 돌지 않았다(2026-10-28)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# 한 번에 하나만 돈다. 앞 점검이 다시 해 보며 기다리는 동안 온 것은 하나만 기다리고 나머지는
# 버려진다 — 쌓이지 않는다. 도는 점검을 끊지 않는다(실패를 알리던 중에 끊기면 경보를 놓친다).
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/oracle/uptime.py
            .github/workflows/pages.yml
          sparse-checkout-cone-mode: false

      - name: 공개 API·Pages 점검
        id: probe
        # 점검이 설계상 가장 오래 걸리는 경우(두 점검 × 세 시도, 요청마다 연결·응답 15초씩, 사이에
        # 최대 60초)보다 길고 job 한도보다 짧다. 여기서 끊기면 step이 실패할 뿐 job은 취소되지 않아
        # 아래 두 step이 «보고서 없는 실패»로 알린다. job 한도에 걸리면 취소라 알리지 않는다.
        timeout-minutes: 8
        run: |
          status=0
          python3 deploy/oracle/uptime.py check --report "$RUNNER_TEMP/uptime-report.txt" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # always()가 아니다 — always()는 취소된 실행에서도 돌아, 끊긴 점검이 상태를 남기지 못한 것을
      # 실패로 읽고 공개 경보를 열었다. 점검이 실패했거나(step 한도 포함) 통과했을 때만 돈다.
      - name: 운영 경보 이슈 열기·덧붙이기·닫기
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 deploy/oracle/uptime.py notify \
            --status "${PROBE_STATUS:-missing}" \
            --report "$RUNNER_TEMP/uptime-report.txt" \
            --run-url "$RUN_URL"

      - name: 점검이 실패했으면 job을 실패로 끝낸다
        if: ${{ !cancelled() && steps.probe.outputs.status != '0' }}
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
        run: |
          echo "uptime check failed (status ${PROBE_STATUS:-missing}); see the 운영 경보 issue"
          exit 1
